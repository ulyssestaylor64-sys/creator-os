services:
  - name: creator-os
    type: web
    runtime: python
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # 可选：在 Render 控制台填入后自动生效
      # - key: GLM_API_KEY
      #   sync: false
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/api/health"
